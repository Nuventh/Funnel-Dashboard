server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Forward API calls to the backend container (service name from compose).
  location /api/ {
    proxy_pass http://backend:3000;
  }

  # Single-page app: always fall back to index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
