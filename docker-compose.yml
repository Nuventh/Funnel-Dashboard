# Funnel dashboard — local orchestration (backend API + Vue frontend).
services:
  backend:
    build: ./backend
    container_name: funnel-dashboard-backend
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    build: ./frontend
    container_name: funnel-dashboard-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped
